services:
  - type: web
    name: timemachine-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: STORE_BACKEND
        value: supabase
      - key: MAX_DAILY_USD
        value: "2.50"
      - key: TINYFISH_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WAKE_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: APP_URL
        sync: false
